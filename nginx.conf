server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-lived caching for hashed asset filenames (Vite fingerprints
    # every build output), but never cache index.html itself — otherwise
    # a redeploy wouldn't be visible until the cache expires.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Same-origin API/admin proxy to the Django container — this is why
    # the frontend build's VITE_API_BASE_URL is "/api/v1" in production
    # rather than an absolute URL: it avoids CORS entirely and lets Nginx
    # be the single public entry point.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    location /media/ {
        proxy_pass http://backend:8000/media/;
    }

    # React Router: any other path falls back to index.html so client-side
    # routing handles it (a hard refresh on /inventory/products must not 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
